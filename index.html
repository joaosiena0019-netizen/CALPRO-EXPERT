<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#07110d">
<meta name="description" content="CALPRO EXPERT - Calculadora comercial">
<title>CALPRO EXPERT</title>

<style>
:root{
  --bg:#07110d;
  --card:#0d1b15;
  --key:#16271f;
  --line:#22382d;
  --text:#f3f7f4;
  --muted:#8ea097;
  --accent:#7cff00;
  --accent-dark:#102319;
  --danger:#ff5d68;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  min-height:100%;
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
  color:inherit;
  cursor:pointer;
}

#app{
  width:min(520px,100%);
  height:100%;
  margin:auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

header{
  height:58px;
  flex:0 0 58px;
  padding:10px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:.4px;
}

.logo span{
  color:var(--accent);
}

.theme-btn{
  width:38px;
  height:38px;
  border-radius:12px;
  background:var(--card);
  border:1px solid var(--line);
}

main{
  flex:1;
  min-height:0;
  overflow:hidden;
  padding:0 13px;
}

.screen{
  display:none;
  height:100%;
  min-height:0;
}

.screen.active{
  display:flex;
  flex-direction:column;
}

.scroll{
  overflow-y:auto;
  scrollbar-width:none;
}

.scroll::-webkit-scrollbar{
  display:none;
}

/* HOME */

.hero{
  padding:13px 3px 12px;
}

.hero h1{
  font-size:26px;
  margin:0 0 5px;
}

.hero p{
  margin:0;
  color:var(--muted);
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
}

.tool{
  min-height:105px;
  text-align:left;
}

.tool .icon{
  font-size:24px;
  margin-bottom:6px;
}

.tool strong{
  display:block;
  font-size:16px;
}

.tool small{
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
}

.ad{
  margin:12px 0;
  padding:7px;
  border:1px dashed var(--line);
  border-radius:10px;
  color:#687a70;
  text-align:center;
  font-size:10px;
}

/* TITLES */

.section-title{
  font-size:18px;
  font-weight:800;
  margin:8px 2px;
}

/* CALCULATOR */

.calc-card{
  height:calc(100% - 38px);
  min-height:0;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:21px;
  padding:9px;
  display:flex;
  flex-direction:column;
}

.display{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  text-align:right;
  padding:5px 9px 7px;
  overflow:hidden;
}

.operation{
  height:20px;
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.calc-display{
  font-size:clamp(32px,8vw,45px);
  line-height:1.08;
  font-weight:500;
  white-space:nowrap;
  overflow-x:auto;
  scrollbar-width:none;
}

.calc-display::-webkit-scrollbar{
  display:none;
}

.calc-format{
  color:var(--muted);
  font-size:9px;
  margin-top:3px;
}

.memory{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  flex:0 0 auto;
  margin-bottom:6px;
}

.memory button{
  height:28px;
  border-radius:9px;
  background:#0a1610;
  border:1px solid var(--line);
  color:var(--muted);
  font-size:11px;
}

.keypad{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  flex:0 0 auto;
}

.key{
  height:clamp(45px,8.5vh,61px);
  border-radius:15px;
  background:var(--key);
  border:1px solid #20372b;
  font-size:20px;
  font-weight:700;
  transition:.1s;
}

.key:active{
  transform:scale(.96);
}

.key.operator{
  color:var(--accent);
  background:var(--accent-dark);
}

.key.action{
  color:#dce8e0;
}

.key.equal{
  background:var(--accent);
  color:#07110d;
}

.more-functions{
  height:30px;
  flex:0 0 30px;
  margin:6px 0;
  border-radius:10px;
  background:transparent;
  border:1px solid var(--line);
  color:var(--accent);
  font-size:11px;
}

.advanced{
  display:none;
  flex:0 0 auto;
}

.advanced.open{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
}

.advanced .key{
  height:38px;
  font-size:14px;
}

/* COMMERCIAL */

.tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin:5px 0 9px;
}

.tab{
  height:38px;
  border-radius:10px;
  background:var(--card);
  color:var(--muted);
  font-size:11px;
  font-weight:800;
}

.tab.active{
  background:var(--accent);
  color:#07110d;
}

.form-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
}

.field{
  margin-bottom:9px;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-bottom:5px;
}

.field input,
.field select{
  width:100%;
  height:43px;
  border-radius:11px;
  border:1px solid var(--line);
  background:#09150f;
  color:var(--text);
  padding:0 12px;
  outline:0;
}

.field input:focus{
  border-color:var(--accent);
}

.primary{
  width:100%;
  height:43px;
  border-radius:11px;
  background:var(--accent);
  color:#07110d;
  font-weight:900;
}

.result{
  margin-top:9px;
  padding:9px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#09150f;
}

.result-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:5px 0;
  border-bottom:1px solid #17271f;
  font-size:12px;
}

.result-row:last-child{
  border-bottom:0;
}

.result-row span{
  color:var(--muted);
}

/* HISTORY */

.history-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:12px;
}

.history-item{
  padding:9px 0;
  border-bottom:1px solid var(--line);
  font-size:12px;
}

.history-item small{
  color:var(--muted);
}

/* SETTINGS */

.settings-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
}

.settings-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:13px 0;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

.settings-row:last-child{
  border-bottom:0;
}

/* BOTTOM NAV */

.bottom-nav{
  height:68px;
  flex:0 0 68px;
  border-top:1px solid var(--line);
  background:rgba(7,17,13,.97);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:5px 7px;
}

.nav-btn{
  background:transparent;
  color:var(--muted);
  border-radius:12px;
  font-size:10px;
}

.nav-btn b{
  display:block;
  font-size:19px;
}

.nav-btn.active{
  color:var(--accent);
  background:#0e1e16;
}

/* TOAST */

.toast{
  position:fixed;
  z-index:100;
  left:50%;
  bottom:76px;
  transform:translate(-50%,12px);
  opacity:0;
  pointer-events:none;
  background:#edf7f0;
  color:#07110d;
  padding:9px 13px;
  border-radius:10px;
  font-size:12px;
  font-weight:800;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* LIGHT */

.light{
  --bg:#f2f5f3;
  --card:#fff;
  --key:#eef2ef;
  --line:#d7e0da;
  --text:#152019;
  --muted:#65746c;
}

.light .bottom-nav{
  background:rgba(242,245,243,.97);
}

/* SMALL HEIGHT */

@media(max-height:650px){

  .tool{
    min-height:88px;
  }

  .key{
    height:43px;
  }

  .display{
    padding-top:2px;
  }

  .calc-display{
    font-size:31px;
  }

  .memory{
    margin-bottom:4px;
  }

  .more-functions{
    margin:4px 0;
  }

  .advanced .key{
    height:33px;
  }
}
</style>
</head>

<body>

<div id="app">

<header>

  <div class="logo">
    CALPRO <span>EXPERT</span>
  </div>

  <button
    class="theme-btn"
    id="themeBtn"
    type="button"
  >
    ◐
  </button>

</header>


<main>

<!-- =========================
     HOME
========================= -->

<section
  id="home"
  class="screen active scroll"
>

  <div class="hero">

    <h1>
      Calculadora comercial
    </h1>

    <p>
      Rápida, precisa e feita para sua rotina.
    </p>

  </div>


  <div class="grid">

    <button
      class="card tool"
      data-open="margin"
      type="button"
    >

      <div class="icon">
        %
      </div>

      <strong>
        MARGEM
      </strong>

      <small>
        Lucro, margem e markup
      </small>

    </button>


    <button
      class="card tool"
      data-open="price"
      type="button"
    >

      <div class="icon">
        R$
      </div>

      <strong>
        PREÇO
      </strong>

      <small>
        Preço de venda
      </small>

    </button>


    <button
      class="card tool"
      data-open="discount"
      type="button"
    >

      <div class="icon">
        −%
      </div>

      <strong>
        DESCONTO
      </strong>

      <small>
        Preço final
      </small>

    </button>


    <button
      class="card tool"
      data-open="markup"
      type="button"
    >

      <div class="icon">
        ×
      </div>

      <strong>
        MARKUP
      </strong>

      <small>
        Markup e margem
      </small>

    </button>


    <button
      class="card tool"
      data-nav="calculator"
      type="button"
    >

      <div class="icon">
        ⌗
      </div>

      <strong>
        CALCULADORA
      </strong>

      <small>
        Cálculos completos
      </small>

    </button>

  </div>


  <div class="ad">
    ESPAÇO PARA DIVULGAÇÃO
  </div>

</section>


<!-- =========================
     CALCULADORA
========================= -->

<section
  id="calculator"
  class="screen"
>

  <div class="section-title">
    Calculadora
  </div>


  <div class="calc-card">

    <div class="display">

      <div
        id="calcOperation"
        class="operation"
      ></div>


      <div
        id="calcDisplay"
        class="calc-display"
      >
        0
      </div>


      <div class="calc-format">
        Formato brasileiro: 1.234,56
      </div>

    </div>


    <!-- MEMÓRIA -->

    <div class="memory">

      <button
        type="button"
        data-memory="MC"
      >
        MC
      </button>

      <button
        type="button"
        data-memory="MR"
      >
        MR
      </button>

      <button
        type="button"
        data-memory="M+"
      >
        M+
      </button>

      <button
        type="button"
        data-memory="M-"
      >
        M−
      </button>

      <button
        type="button"
        data-memory="MS"
      >
        MS
      </button>

    </div>


    <!-- TECLADO -->

    <div class="keypad">

      <button
        class="key action"
        data-key="clear"
        type="button"
      >
        AC
      </button>

      <button
        class="key action"
        data-key="backspace"
        type="button"
      >
        ⌫
      </button>

      <button
        class="key operator"
        data-key="percent"
        type="button"
      >
        %
      </button>

      <button
        class="key operator"
        data-key="divide"
        type="button"
      >
        ÷
      </button>


      <button
        class="key"
        data-number="7"
        type="button"
      >
        7
      </button>

      <button
        class="key"
        data-number="8"
        type="button"
      >
        8
      </button>

      <button
        class="key"
        data-number="9"
        type="button"
      >
        9
      </button>

      <button
        class="key operator"
        data-key="multiply"
        type="button"
      >
        ×
      </button>


      <button
        class="key"
        data-number="4"
        type="button"
      >
        4
      </button>

      <button
        class="key"
        data-number="5"
        type="button"
      >
        5
      </button>

      <button
        class="key"
        data-number="6"
        type="button"
      >
        6
      </button>

      <button
        class="key operator"
        data-key="subtract"
        type="button"
      >
        −
      </button>


      <button
        class="key"
        data-number="1"
        type="button"
      >
        1
      </button>

      <button
        class="key"
        data-number="2"
        type="button"
      >
        2
      </button>

      <button
        class="key"
        data-number="3"
        type="button"
      >
        3
      </button>

      <button
        class="key operator"
        data-key="add"
        type="button"
      >
        +
      </button>


      <button
        class="key action"
        data-key="sign"
        type="button"
      >
        +/−
      </button>

      <button
        class="key"
        data-number="0"
        type="button"
      >
        0
      </button>

      <button
        class="key"
        data-key="decimal"
        type="button"
      >
        ,
      </button>

      <button
        class="key equal"
        data-key="equals"
        type="button"
      >
        =
      </button>

    </div>


    <button
      class="more-functions"
      id="advancedToggle"
      type="button"
    >
      Mais funções
    </button>


    <div
      class="advanced"
      id="advanced"
    >

      <button
        class="key"
        data-key="sqrt"
        type="button"
      >
        √
      </button>

      <button
        class="key"
        data-key="square"
        type="button"
      >
        x²
      </button>

      <button
        class="key"
        data-key="power"
        type="button"
      >
        xʸ
      </button>

      <button
        class="key"
        data-key="clearEntry"
        type="button"
      >
        CE
      </button>

      <button
        class="key"
        data-key="pi"
        type="button"
      >
        π
      </button>

      <button
        class="key"
        data-key="repeat"
        type="button"
      >
        ↻
      </button>

      <button
        class="key"
        data-key="leftParen"
        type="button"
      >
        (
      </button>

      <button
        class="key"
        data-key="rightParen"
        type="button"
      >
        )
      </button>

    </div>

  </div>

</section>


<!-- =========================
     COMERCIAL
========================= -->

<section
  id="commercial"
  class="screen scroll"
>

  <div class="section-title">
    Ferramentas comerciais
  </div>


  <div class="form-card">

    <div class="tabs">

      <button
        class="tab active"
        data-tab="margin"
        type="button"
      >
        MARGEM
      </button>

      <button
        class="tab"
        data-tab="price"
        type="button"
      >
        PREÇO
      </button>

      <button
        class="tab"
        data-tab="discount"
        type="button"
      >
        DESCONTO
      </button>

      <button
        class="tab"
        data-tab="markup"
        type="button"
      >
        MARKUP
      </button>

    </div>


    <!-- MARGEM -->

    <div
      id="panel-margin"
      class="panel"
    >

      <div class="field">

        <label>
          Custo (R$)
        </label>

        <input
          id="marginCost"
          type="text"
          inputmode="decimal"
          placeholder="0,00"
        >

      </div>


      <div class="field">

        <label>
          Preço de venda (R$)
        </label>

        <input
          id="marginSale"
          type="text"
          inputmode="decimal"
          placeholder="0,00"
        >

      </div>


      <button
        class="primary"
        data-calc-commercial="margin"
        type="button"
      >
        CALCULAR
      </button>


      <div
        id="result-margin"
        class="result"
      ></div>

    </div>


    <!-- PREÇO -->

    <div
      id="panel-price"
      class="panel"
      hidden
    >

      <div class="field">

        <label>
          Custo (R$)
        </label>

        <input
          id="priceCost"
          type="text"
          inputmode="decimal"
          placeholder="0,00"
        >

      </div>


      <div class="field">

        <label>
          Margem desejada (%)
        </label>

        <input
          id="priceMargin"
          type="text"
          inputmode="decimal"
          placeholder="30,00"
        >

      </div>


      <div class="field">

        <label>
          Ou markup desejado (%)
        </label>

        <input
          id="priceMarkup"
          type="text"
          inputmode="decimal"
          placeholder="50,00"
        >

      </div>


      <button
        class="primary"
        data-calc-commercial="price"
        type="button"
      >
        CALCULAR
      </button>


      <div
        id="result-price"
        class="result"
      ></div>

    </div>


    <!-- DESCONTO -->

    <div
      id="panel-discount"
      class="panel"
      hidden
    >

      <div class="field">

        <label>
          Preço original (R$)
        </label>

        <input
          id="discountOriginal"
          type="text"
          inputmode="decimal"
          placeholder="0,00"
        >

      </div>


      <div class="field">

        <label>
          Desconto (%)
        </label>

        <input
          id="discountPercent"
          type="text"
          inputmode="decimal"
          placeholder="10,00"
        >

      </div>


      <button
        class="primary"
        data-calc-commercial="discount"
        type="button"
      >
        CALCULAR
      </button>


      <div
        id="result-discount"
        class="result"
      ></div>

    </div>


    <!-- MARKUP -->

    <div
      id="panel-markup"
      class="panel"
      hidden
    >

      <div class="field">

        <label>
          Custo (R$)
        </label>

        <input
          id="markupCost"
          type="text"
          inputmode="decimal"
          placeholder="0,00"
        >

      </div>


      <div class="field">

        <label>
          Markup (%)
        </label>

        <input
          id="markupPercent"
          type="text"
          inputmode="decimal"
          placeholder="50,00"
        >

      </div>


      <button
        class="primary"
        data-calc-commercial="markup"
        type="button"
      >
        CALCULAR
      </button>


      <div
        id="result-markup"
        class="result"
      ></div>

    </div>

  </div>

</section>


<!-- =========================
     HISTÓRICO
========================= -->

<section
  id="history"
  class="screen scroll"
>

  <div class="section-title">
    Histórico
  </div>


  <div class="history-card">

    <button
      class="primary"
      id="clearHistory"
      type="button"
    >
      LIMPAR HISTÓRICO
    </button>


    <div id="historyList"></div>

  </div>

</section>


<!-- =========================
     CONFIGURAÇÕES
========================= -->

<section
  id="settings"
  class="screen scroll"
>

  <div class="section-title">
    Configurações
  </div>


  <div class="settings-card">

    <div class="settings-row">

      <span>
        Tema
      </span>

      <select id="themeSelect">

        <option value="dark">
          Escuro
        </option>

        <option value="light">
          Claro
        </option>

      </select>

    </div>


    <div class="settings-row">

      <span>
        Vibração
      </span>

      <input
        id="vibrationToggle"
        type="checkbox"
        checked
      >

    </div>

  </div>

</section>

</main>


<!-- =========================
     MENU
========================= -->

<nav class="bottom-nav">

  <button
    class="nav-btn active"
    data-nav="home"
    type="button"
  >
    <b>⌂</b>
    Início
  </button>


  <button
    class="nav-btn"
    data-nav="calculator"
    type="button"
  >
    <b>⌗</b>
    Calculadora
  </button>

<script>

"use strict";


/* =====================================================
   UTILITÁRIOS
===================================================== */

const $ = selector =>
  document.querySelector(selector);


const $$ = selector =>
  Array.from(

  );


function toast(message){

  const element =
    $("#toast");

  element.textContent =
    message;

  element.classList.add("show");

  clearTimeout(
    window.__toastTimer
  );

  window.__toastTimer =
    setTimeout(
      () => {
        element.classList.remove("show");
      },
      1600
    );
}


function vibrate(){

    $("#vibrationToggle")?.checked &&

    navigator.vibrate(7);

  }

}


/* =====================================================
   DECIMAL EXATO
   Evita problemas como:
   0,1 + 0,2 = 0,30000000000000004
===================================================== */

const DECIMAL_PLACES = 12;


function normalizeDecimal(value){

  let text =
    String(value)
    .trim()
    .replace(",", ".");


  if(!text)
    return "0";


  let sign = "";


  if(
    text.startsWith("-")
  ){

    sign = "-";

    text =
      text.slice(1);

  }


  if(
    !/^\d*\.?\d*$/.test(text)
  ){

    return "0";

  }


  let [
    integer = "0",
    decimal = ""
  ] =
    text.split(".");


  integer =
    integer
    .replace(
      /^0+(?=\d)/,
      ""
    ) || "0";


  decimal =
    decimal.replace(
      /0+$/,
      ""
    );


  return (
    sign +
    integer +
    (
      decimal
        ? "." + decimal
        : ""
    )
  );

}


function decimalParts(value){

  let text =
    normalizeDecimal(value);


  const negative =
    text.startsWith("-");


  if(negative)
    text =
      text.slice(1);


  const parts =
    text.split(".");


  const integer =
    parts[0] || "0";


  const decimal =
    parts[1] || "";


  let digits =
    integer + decimal;


  if(!digits)
    digits = "0";


  let number =
    BigInt(digits);


  if(negative)
    number =
      -number;


  return {
    integer:number,
    scale:decimal.length
  };

}


function power10(n){

  return 10n ** BigInt(n);

}


function decimalFromBigInt(
  integer,
  scale
){

  if(
    integer === 0n
  ){

    return "0";

  }


  const negative =
    integer < 0n;


  if(negative)
    integer =
      -integer;


  let digits =
    integer.toString();


  if(scale === 0){

    return (
      negative
        ? "-"
        : ""
    ) + digits;

  }


  if(
    digits.length <= scale
  ){

    digits =
      "0".repeat(
        scale +
        1 -
        digits.length
      ) +
      digits;

  }


  const position =
    digits.length -
    scale;


  let result =
    digits.slice(
      0,
      position
    ) +
    "." +
    digits.slice(position);


  result =
    result
    .replace(
      /(\.\d*?)0+$/,
      "$1"
    )
    .replace(
      /\.$/,
      ""
    );


  return (
    negative
      ? "-"
      : ""
  ) + result;

}


function decimalAdd(a,b){

  const A =
    decimalParts(a);

  const B =
    decimalParts(b);


  const scale =
    Math.max(
      A.scale,
      B.scale
    );


  return decimalFromBigInt(
    A.integer *
      power10(
        scale -
        A.scale
      ) +
    B.integer *
      power10(
        scale -
        B.scale
      ),
    scale
  );

}


function decimalSubtract(a,b){

  const A =
    decimalParts(a);

  const B =
    decimalParts(b);


  const scale =
    Math.max(
      A.scale,
      B.scale
    );


  return decimalFromBigInt(
    A.integer *
      power10(
        scale -
        A.scale
      ) -
    B.integer *
      power10(
        scale -
        B.scale
      ),
    scale
  );

}


function decimalMultiply(a,b){

  const A =
    decimalParts(a);

  const B =
    decimalParts(b);


  return decimalFromBigInt(
    A.integer *
      B.integer,
    A.scale +
      B.scale
  );

}


function decimalDivide(a,b){

  const A =
    decimalParts(a);

  const B =
    decimalParts(b);


  if(
    B.integer === 0n
  ){

    return null;

  }


  const negative =
    (
      A.integer < 0n
    ) !== (
      B.integer < 0n
    );


  const numerator =
    A.integer < 0n
      ? -A.integer
      : A.integer;


  const denominator =
    B.integer < 0n
      ? -B.integer
      : B.integer;


  const scale =
    DECIMAL_PLACES;


  const scaledNumerator =
    numerator *
    power10(
      scale +
      B.scale
    );


  const scaledDenominator =
    denominator *
    power10(
      A.scale
    );


  let quotient =
    scaledNumerator /
    scaledDenominator;


  const remainder =
    scaledNumerator %
    scaledDenominator;


  /*
    Arredondamento half-up.
  */

  if(
    remainder * 2n >=
    scaledDenominator
  ){

    quotient +=
      1n;

  }


  if(negative)
    quotient =
      -quotient;


  return decimalFromBigInt(
    quotient,
    scale
  );

}


function exactOperation(
  a,
  b,
  operator
){

  switch(operator){

    case "add":
      return decimalAdd(a,b);

    case "subtract":
      return decimalSubtract(a,b);

    case "multiply":
      return decimalMultiply(a,b);

    case "divide":
      return decimalDivide(a,b);

    default:
      return b;

  }

}


/* =====================================================
   FORMATAÇÃO BRASILEIRA
===================================================== */

function formatDisplay(value){

  let text =
    normalizeDecimal(value);


  if(text === "0")
    return "0";


  const negative =
    text.startsWith("-");


  if(negative)
    text =
      text.slice(1);


  let [
    integer,
    decimal = ""
  ] =
    text.split(".");


  integer =
    integer.replace(
      /\B(?=(\d{3})+(?!\d))/g,
      "."
    );


  return (
    negative
      ? "-"
      : ""
  ) +
  integer +
  (
    decimal
      ? "," + decimal
      : ""
  );

}


function nativeNumber(value){

  return Number(
    normalizeDecimal(value)
  );

}


function money(value){

  const number =
    typeof value === "number"
      ? value
      : nativeNumber(value);


  if(!Number.isFinite(number))
    return "—";


  return number.toLocaleString(
    "pt-BR",
    {
      style:"currency",
      currency:"BRL",
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


function percentage(value){

  const number =
    typeof value === "number"
      ? value
      : nativeNumber(value);


  if(!Number.isFinite(number))
    return "—";


  return number.toLocaleString(
    "pt-BR",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  ) + "%";

}

/* =====================================================
   CALCULADORA
===================================================== */

const calculator = {

  current:"0",

  previous:null,

  operator:null,

  waiting:false,

  expression:"",

  lastOperator:null,

  lastOperand:null,

  memory:"0",

  error:false

};


const operatorSymbols = {

  add:"+",

  subtract:"−",

  multiply:"×",

  divide:"÷",

  power:"^"

};


function updateCalculator(){

  $("#calcDisplay")
    .textContent =
    formatDisplay(
      calculator.current
    );


  $("#calcOperation")
    .textContent =
    calculator.expression ||
    "";


  const display =
    $("#calcDisplay");


  display.scrollLeft =
    display.scrollWidth;

}


function resetCalculator(){

  calculator.current =
    "0";

  calculator.previous =
    null;

  calculator.operator =
    null;

  calculator.waiting =
    false;

  calculator.expression =
    "";

  calculator.lastOperator =
    null;

  calculator.lastOperand =
    null;

  calculator.error =
    false;

  updateCalculator();

}


function inputNumber(number){

  vibrate();


  if(
    calculator.error
  ){

    resetCalculator();

  }


  if(
    calculator.waiting
  ){

    calculator.current =
      number;

    calculator.waiting =
      false;

  }else{

    const current =
      normalizeDecimal(
        calculator.current
      );


    if(
      current === "0"
    ){

      calculator.current =
        number;

    }else{

      const negative =
        current.startsWith("-");


      const unsigned =
        negative
          ? current.slice(1)
          : current;


      if(
        unsigned
        .replace(".","")
        .length >= 15
      ){

        return;

      }


      calculator.current +=
        number;

    }

  }


  updateCalculator();

}


function inputDecimal(){

  vibrate();


  if(
    calculator.error
  ){

    resetCalculator();

  }


  if(
    calculator.waiting
  ){

    calculator.current =
      "0.";

    calculator.waiting =
      false;

  }else if(
    !normalizeDecimal(
      calculator.current
    ).includes(".")
  ){

    calculator.current =
      normalizeDecimal(
        calculator.current
      ) +
      ".";

  }


  updateCalculator();

}


function backspace(){

  vibrate();


  if(
    calculator.error
  ){

    resetCalculator();

    return;

  }


  if(
    calculator.waiting
  )
    return;


  const current =
    calculator.current;


  if(
    current.length <= 1 ||
    (
      current.length === 2 &&
      current.startsWith("-")
    )
  ){

    calculator.current =
      "0";

  }else{

    calculator.current =
      current.slice(
        0,
        -1
      );

  }


  updateCalculator();

}


function toggleSign(){

  vibrate();


  if(
    calculator.error ||
    calculator.current === "0"
  )
    return;


  calculator.current =
    calculator.current.startsWith("-")
      ? calculator.current.slice(1)
      : "-" +
        calculator.current;


  updateCalculator();

}


function calculatePercent(){

  vibrate();


  if(
    calculator.error
  )
    return;


  const current =
    normalizeDecimal(
      calculator.current
    );


  let result;


  if(
    calculator.previous !== null &&
    (
      calculator.operator === "add" ||
      calculator.operator === "subtract"
    )
  ){

    result =
      decimalDivide(
        decimalMultiply(
          calculator.previous,
          current
        ),
        "100"
      );

  }else{

    result =
      decimalDivide(
        current,
        "100"
      );

  }


  if(result === null){

    showCalculatorError();

    return;

  }


  calculator.current =
    result;


  updateCalculator();

}


function chooseOperator(operator){

  vibrate();


  if(
    calculator.error
  )
    return;


  const current =
    normalizeDecimal(
      calculator.current
    );


  if(
    calculator.operator &&
    calculator.previous !== null &&
    !calculator.waiting
  ){

    const result =
      exactOperation(
        calculator.previous,
        current,
        calculator.operator
      );


    if(result === null){

      showCalculatorError();

      return;

    }


    calculator.previous =
      result;

    calculator.current =
      result;

  }else{

    calculator.previous =
      current;

  }


  calculator.operator =
    operator;

  calculator.waiting =
    true;

  calculator.lastOperator =
    null;

  calculator.lastOperand =
    null;


  calculator.expression =
    formatDisplay(
      calculator.previous
    ) +
    " " +
    operatorSymbols[
      operator
    ];


  updateCalculator();

}


function equals(){

  vibrate();


  if(
    calculator.error
  )
    return;


  if(
    calculator.operator !== null &&
    calculator.previous !== null
  ){

    const operand =
      calculator.waiting
        ? calculator.previous
        : normalizeDecimal(
            calculator.current
          );


    const result =
      exactOperation(
        calculator.previous,
        operand,
        calculator.operator
      );


    if(result === null){

      showCalculatorError();

      return;

    }


    calculator.lastOperator =
      calculator.operator;

    calculator.lastOperand =
      operand;


    calculator.expression =
      formatDisplay(
        calculator.previous
      ) +
      " " +
      operatorSymbols[
        calculator.operator
      ] +
      " " +
      formatDisplay(
        operand
      ) +
      " =";


    calculator.current =
      result;

    calculator.previous =
      null;

    calculator.operator =
      null;

    calculator.waiting =
      true;


    addHistory(
      "Calculadora",
      calculator.expression,
      formatDisplay(
        calculator.current
      )
    );

  }else if(
    calculator.lastOperator !== null &&
    calculator.lastOperand !== null
  ){

    const left =
      normalizeDecimal(
        calculator.current
      );


    const result =
      exactOperation(
        left,
        calculator.lastOperand,
        calculator.lastOperator
      );


    if(result === null){

      showCalculatorError();

      return;

    }


    calculator.expression =
      formatDisplay(left) +
      " " +
      operatorSymbols[
        calculator.lastOperator
      ] +
      " " +
      formatDisplay(
        calculator.lastOperand
      ) +
      " =";


    calculator.current =
      result;

    calculator.waiting =
      true;


    addHistory(
      "Calculadora",
      calculator.expression,
      formatDisplay(
        calculator.current
      )
    );

  }


  updateCalculator();

}


function unaryOperation(type){

  vibrate();


  if(
    calculator.error
  )
    return;


  const value =
    nativeNumber(
      calculator.current
    );


  if(
    !Number.isFinite(value)
  ){

    showCalculatorError();

    return;

  }


  let result;

  let label;


  if(
    type === "sqrt"
  ){

    if(value < 0){

      showCalculatorError();

      return;

    }


    result =
      Math.sqrt(value);

    label =
      "√" +
      formatDisplay(
        calculator.current
      );

  }else{

    result =
      value *
      value;

    label =
      formatDisplay(
        calculator.current
      ) +
      "²";

  }


  if(
    !Number.isFinite(result)
  ){

    showCalculatorError();

    return;

  }


  calculator.current =
    normalizeDecimal(
      result.toFixed(12)
    );


  calculator.expression =
    label +
    " =";


  calculator.waiting =
    true;


  addHistory(
    "Calculadora",
    calculator.expression,
    formatDisplay(
      calculator.current
    )
  );


  updateCalculator();

}


function clearEntry(){

  vibrate();

  calculator.current =
    "0";

  calculator.waiting =
    false;

  updateCalculator();

}


function showCalculatorError(){

  calculator.current =
    "0";

  calculator.expression =
    "Operação inválida";

  calculator.error =
    true;

  updateCalculator();

  toast(
    "Operação inválida"
  );

}


function insertPi(){

  if(
    calculator.error
  )
    resetCalculator();


  calculator.current =
    normalizeDecimal(
      Math.PI.toFixed(12)
    );


  calculator.waiting =
    true;

  calculator.expression =
    "π";

  updateCalculator();

}


/*
  Parênteses ficam disponíveis no modo avançado.
  O modo principal não usa eval(), garantindo que
  operações financeiras não sejam executadas por
  código arbitrário.
*/

function parenthesisMessage(){

  toast(
    "Use as operações do teclado para manter a precisão"
  );

}


/* =====================================================
   BOTÕES DA CALCULADORA
===================================================== */

$$(".key")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          const number =
            button.dataset.number;

          const key =
            button.dataset.key;


          if(
            number !== undefined
          ){

            inputNumber(
              number
            );

            return;

          }


          switch(key){

            case "clear":

              resetCalculator();

              break;


            case "backspace":

              backspace();

              break;


            case "decimal":

              inputDecimal();

              break;


            case "sign":

              toggleSign();

              break;


            case "percent":

              calculatePercent();

              break;


            case "divide":

              chooseOperator(
                "divide"
              );

              break;


            case "multiply":

              chooseOperator(
                "multiply"
              );

              break;


            case "subtract":

              chooseOperator(
                "subtract"
              );

              break;


            case "add":

              chooseOperator(
                "add"
              );

              break;


            case "equals":

              equals();

              break;


            case "sqrt":

              unaryOperation(
                "sqrt"
              );

              break;


            case "square":

              unaryOperation(
                "square"
              );

              break;


            case "clearEntry":

              clearEntry();

              break;


            case "power":

              chooseOperator(
                "power"
              );

              break;


            case "pi":

              insertPi();

              break;


            case "repeat":

              equals();

              break;


            case "leftParen":
            case "rightParen":

              parenthesisMessage();

              break;

          }

        }
      );

    }
  );


/* =====================================================
   TECLADO FÍSICO
===================================================== */

document.addEventListener(
  "keydown",
  event => {

    const tag =
      document.activeElement?.tagName;


    if(
      tag === "INPUT" ||
      tag === "TEXTAREA" ||
      tag === "SELECT"
    )
      return;


    const key =
      event.key;


    if(
      /^[0-9]$/.test(key)
    ){

      event.preventDefault();

      inputNumber(
        key
      );

    }else if(
      key === "." ||
      key === ","
    ){

      event.preventDefault();

      inputDecimal();

    }else if(
      key === "+"
    ){

      event.preventDefault();

      chooseOperator(
        "add"
      );

    }else if(
      key === "-"
    ){

      event.preventDefault();

      chooseOperator(
        "subtract"
      );

    }else if(
      key === "*"
    ){

      event.preventDefault();

      chooseOperator(
        "multiply"
      );

    }else if(
      key === "/"
    ){

      event.preventDefault();

      chooseOperator(
        "divide"
      );

    }else if(
      key === "%"
    ){

      event.preventDefault();

      calculatePercent();

    }else if(
      key === "Enter" ||
      key === "="
    ){

      event.preventDefault();

      equals();

    }else if(
      key === "Backspace"
    ){

      event.preventDefault();

      backspace();

    }else if(
      key === "Escape"
    ){

      event.preventDefault();

      resetCalculator();

    }

  }
);

/* =====================================================
   MEMÓRIA
===================================================== */

calculator.memory =
  normalizeDecimal(
    localStorage.getItem(
      "calpro_memory"
    ) || "0"
  );


$$("[data-memory]")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          vibrate();


          const action =
            button.dataset.memory;


          const current =
            normalizeDecimal(
              calculator.current
            );


          if(
            action === "MC"
          ){

            calculator.memory =
              "0";

            toast(
              "Memória limpa"
            );

          }


          else if(
            action === "MR"
          ){

            calculator.current =
              calculator.memory;

            calculator.waiting =
              true;

            toast(
              "Memória recuperada"
            );

          }


          else if(
            action === "M+"
          ){

            calculator.memory =
              decimalAdd(
                calculator.memory,
                current
              );

            toast(
              "Valor somado à memória"
            );

          }


          else if(
            action === "M-"
          ){

            calculator.memory =
              decimalSubtract(
                calculator.memory,
                current
              );

            toast(
              "Valor subtraído da memória"
            );

          }


          else if(
            action === "MS"
          ){

            calculator.memory =
              current;

            toast(
              "Valor salvo na memória"
            );

          }


          localStorage.setItem(
            "calpro_memory",
            calculator.memory
          );


          updateCalculator();

        }
      );

    }
  );


/* =====================================================
   HISTÓRICO
===================================================== */

function getHistory(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "calpro_history"
      ) || "[]"
    );

  }catch{

    return [];

  }

}


function escapeHtml(
  value
){

  return String(value)
    .replace(
      /[&<>"']/g,
      character => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[character])
    );

}


function addHistory(
  type,
  expression,
  result
){

  const history =
    getHistory();


  history.unshift({

    type,

    expression,

    result:String(
      result
    ),

    date:
      new Date()
      .toLocaleString(
        "pt-BR"
      )

  });


  localStorage.setItem(
    "calpro_history",
    JSON.stringify(
      history.slice(
        0,
        100
      )
    )
  );


  renderHistory();

}


function renderHistory(){

  const list =
    $("#historyList");


  const history =
    getHistory();


  if(
    !history.length
  ){

    list.innerHTML =
      '<div style="padding:20px;text-align:center;color:var(--muted)">Nenhum cálculo realizado.</div>';

    return;

  }


  list.innerHTML =
    history
      .map(
        item => `

          <div class="history-item">

            <strong>
              ${escapeHtml(
                item.type
              )}
            </strong>

            —

            <strong>
              ${escapeHtml(
                item.result
              )}
            </strong>

            <br>

            ${escapeHtml(
              item.expression
            )}

            <br>

            <small>
              ${escapeHtml(
                item.date
              )}
            </small>

          </div>

        `
      )
      .join("");

}


$("#clearHistory")
  .addEventListener(
    "click",
    () => {

      localStorage.removeItem(
        "calpro_history"
      );

      renderHistory();

      toast(
        "Histórico apagado"
      );

    }
  );


/* =====================================================
   CALCULADORAS COMERCIAIS
===================================================== */

function parseBrazilianInput(
  id
){

  const element =
    document.getElementById(
      id
    );


  if(!element)
    return 0;


  const text =
    element.value
      .trim();


  if(!text)
    return 0;


  /*
    1.234,56
      ↓
    1234.56
  */

  let normalized =
    text;


  if(
    text.includes(",")
  ){

    normalized =
      text
        .replace(
          /\./g,
          ""
        )
        .replace(
          ",",
          "."
        );

  }


  const value =
    Number(
      normalized
    );


  return Number.isFinite(
    value
  )
    ? value
    : 0;

}


function formatInputBrazilian(
  input
){

  let value =
    input.value
      .replace(
        /[^\d,.-]/g,
        ""
      );


  const negative =
    value.startsWith("-");


  value =
    value.replace(
      /-/g,
      ""
    );


  const parts =
    value.split(",");


  let integer =
    parts[0] ||
    "0";


  let decimal =
    parts.length > 1
      ? parts
          .slice(1)
          .join("")
      : "";


  integer =
    integer
      .replace(
        /^0+(?=\d)/,
        ""
      ) ||
    "0";


  integer =
    integer.replace(
      /\B(?=(\d{3})+(?!\d))/g,
      "."
    );


  input.value =
    (
      negative
        ? "-"
        : ""
    ) +
    integer +
    (
      parts.length > 1
        ? "," +
          decimal.slice(
            0,
            10
          )
        : ""
    );

}


const commercialInputs = [

  "marginCost",
  "marginSale",

  "priceCost",
  "priceMargin",
  "priceMarkup",

  "discountOriginal",
  "discountPercent",

  "markupCost",
  "markupPercent"

];


commercialInputs
  .forEach(
    id => {

      const input =
        document.getElementById(
          id
        );


      if(!input)
        return;


      input.addEventListener(
        "input",
        () => {

          formatInputBrazilian(
            input
          );

        }
      );


      input.addEventListener(
        "blur",
        () => {

          const value =
            parseBrazilianInput(
              id
            );


          if(
            input.value.trim() !== "" &&
            Number.isFinite(
              value
            )
          ){

            input.value =
              value.toLocaleString(
                "pt-BR",
                {
                  minimumFractionDigits:2,
                  maximumFractionDigits:2
                }
              );

          }

        }
      );

    }
  );


function setCommercialTab(
  name
){

  $$(".tab")
    .forEach(
      tab => {

        tab.classList.toggle(
          "active",
          tab.dataset.tab === name
        );

      }
    );


  [
    "margin",
    "price",
    "discount",
    "markup"

  ].forEach(
    panel => {

      const element =
        document.getElementById(
          "panel-" +
          panel
        );


      element.hidden =
        panel !== name;

    }
  );

}


$$("[data-tab]")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          setCommercialTab(
            button.dataset.tab
          );

        }
      );

    }
  );


function renderResult(
  id,
  rows
){

  const element =
    document.getElementById(
      id
    );


  element.innerHTML =
    rows
      .map(
        row => `

          <div class="result-row">

            <span>
              ${escapeHtml(
                row[0]
              )}
            </span>

            <strong>
              ${escapeHtml(
                row[1]
              )}
            </strong>

          </div>

        `
      )
      .join("");

}


$$("[data-calc-commercial]")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          vibrate();


          const type =
            button.dataset
              .calcCommercial;


          /* =====================
             MARGEM
          ===================== */

          if(
            type === "margin"
          ){

            const cost =
              parseBrazilianInput(
                "marginCost"
              );


            const sale =
              parseBrazilianInput(
                "marginSale"
              );


            if(
              cost <= 0 ||
              sale <= 0
            ){

              toast(
                "Informe custo e preço de venda"
              );

              return;

            }


            const profit =
              sale -
              cost;


            const margin =
              profit /
              sale *
              100;


            const markup =
              profit /
              cost *
              100;


            renderResult(
              "result-margin",
              [

                [
                  "Lucro",
                  money(profit)
                ],

                [
                  "Margem",
                  percentage(margin)
                ],

                [
                  "Markup",
                  percentage(markup)
                ]

              ]
            );


            addHistory(
              "Margem",
              money(cost) +
              " → " +
              money(sale),
              percentage(margin)
            );

          }


          /* =====================
             PREÇO
          ===================== */

          if(
            type === "price"
          ){

            const cost =
              parseBrazilianInput(
                "priceCost"
              );


            const margin =
              parseBrazilianInput(
                "priceMargin"
              );


            const markup =
              parseBrazilianInput(
                "priceMarkup"
              );


            if(
              cost <= 0
            ){

              toast(
                "Informe o custo"
              );

              return;

            }


            let sale;


            if(
              margin > 0
            ){

              if(
                margin >= 100
              ){

                toast(
                  "A margem deve ser menor que 100%"
                );

                return;

              }


              sale =
                cost /
                (
                  1 -
                  margin /
                  100
                );

            }

            else if(
              markup > 0
            ){

              sale =
                cost *
                (
                  1 +
                  markup /
                  100
                );

            }

            else{

              toast(
                "Informe margem ou markup"
              );

              return;

            }


            const profit =
              sale -
              cost;


            const realMargin =
              profit /
              sale *
              100;


            const realMarkup =
              profit /
              cost *
              100;


            renderResult(
              "result-price",
              [

                [
                  "Preço de venda",
                  money(sale)
                ],

                [
                  "Lucro",
                  money(profit)
                ],

                [
                  "Margem real",
                  percentage(realMargin)
                ],

                [
                  "Markup real",
                  percentage(realMarkup)
                ]

              ]
            );


            addHistory(
              "Preço",
              money(cost) +
              " → " +
              money(sale),
              money(sale)
            );

          }


          /* =====================
             DESCONTO
          ===================== */

          if(
            type === "discount"
          ){

            const original =
              parseBrazilianInput(
                "discountOriginal"
              );


            const percent =
              parseBrazilianInput(
                "discountPercent"
              );


            if(
              original <= 0 ||
              percent < 0
            ){

              toast(
                "Informe os valores corretamente"
              );

              return;

            }


            const discount =
              original *
              percent /
              100;


            const finalPrice =
              original -
              discount;


            renderResult(
              "result-discount",
              [

                [
                  "Desconto",
                  money(discount)
                ],

                [
                  "Preço final",
                  money(finalPrice)
                ],

                [
                  "Percentual",
                  percentage(percent)
                ]

              ]
            );


            addHistory(
              "Desconto",
              money(original) +
              " − " +
              percentage(percent),
              money(finalPrice)
            );

          }


          /* =====================
             MARKUP
          ===================== */

          if(
            type === "markup"
          ){

            const cost =
              parseBrazilianInput(
                "markupCost"
              );


            const percent =
              parseBrazilianInput(
                "markupPercent"
              );


            if(
              cost <= 0 ||
              percent < 0
            ){

              toast(
                "Informe os valores corretamente"
              );

              return;

            }


            const profit =
              cost *
              percent /
              100;


            const sale =
              cost +
              profit;


            const margin =
              profit /
              sale *
              100;


            renderResult(
              "result-markup",
              [

                [
                  "Preço de venda",
                  money(sale)
                ],

                [
                  "Lucro",
                  money(profit)
                ],

                [
                  "Margem",
                  percentage(margin)
                ],

                [
                  "Markup",
                  percentage(percent)
                ]

              ]
            );


            addHistory(
              "Markup",
              money(cost) +
              " + " +
              percentage(percent),
              money(sale)
            );

          }

        }
      );

    }
  );


/* =====================================================
   TEMA
===================================================== */

function setTheme(
  theme
){

  document.body
    .classList
    .toggle(
      "light",
      theme === "light"
    );


  localStorage.setItem(
    "calpro_theme",
    theme
  );


  $("#themeSelect")
    .value =
    theme;

}


const savedTheme =
  localStorage.getItem(
    "calpro_theme"
  ) ||
  "dark";


setTheme(
  savedTheme
);


$("#themeSelect")
  .addEventListener(
    "change",
    event => {

      setTheme(
        event.target.value
      );

    }
  );


$("#themeBtn")
  .addEventListener(
    "click",
    () => {

      setTheme(
        document.body
          .classList
          .contains("light")
          ? "dark"
          : "light"
      );

    }
  );


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

renderHistory();

updateCalculator();

</script>
