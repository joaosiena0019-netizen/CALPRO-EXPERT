<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#07110d">
<meta name="description" content="CALPRO EXPERT - Calculadora comercial">
<title>CALPRO EXPERT</title>

<style>
:root{
  --bg:#07110d;
  --card:#0d1b15;
  --text:#f3f7f4;
  --muted:#91a39a;
  --accent:#7cff00;
  --line:#1d3027;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  min-height:100vh;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  color:inherit;
  cursor:pointer;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding-bottom:86px;
}

header{
  padding:22px 18px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-weight:900;
  letter-spacing:.5px;
  font-size:22px;
}

.logo span{
  color:var(--accent);
}

.header-btn{
  width:42px;
  height:42px;
  border-radius:14px;
  background:var(--card);
  border:1px solid var(--line);
}

main{
  padding:0 14px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.hero{
  padding:18px 4px 16px;
}

.hero h1{
  font-size:28px;
  margin:0 0 6px;
}

.hero p{
  margin:0;
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.card{
  background:linear-gradient(145deg,var(--card),#09150f);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
}

.tool{
  min-height:118px;
  text-align:left;
}

.tool strong{
  display:block;
  font-size:18px;
  margin-bottom:8px;
}

.tool small{
  color:var(--muted);
}

.icon{
  font-size:26px;
  margin-bottom:8px;
}

.section-title{
  font-size:19px;
  font-weight:800;
  margin:20px 2px 12px;
}

.ad{
  margin:18px 0;
  padding:9px 12px;
  border:1px dashed #294437;
  border-radius:12px;
  text-align:center;
  color:#6f8278;
  font-size:11px;
}

.calc-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:12px;
}

.display{
  min-height:126px;
  padding:14px 12px 8px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  text-align:right;
  overflow:hidden;
}

.operation{
  color:var(--muted);
  font-size:14px;
  min-height:22px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.calc-display{
  font-size:43px;
  font-weight:500;
  letter-spacing:-1px;
  white-space:nowrap;
  overflow-x:auto;
  scrollbar-width:none;
}

.calc-display::-webkit-scrollbar{
  display:none;
}

.memory{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  margin-bottom:10px;
}

.memory button{
  padding:8px 4px;
  border-radius:11px;
  background:#0b1711;
  color:var(--muted);
  font-size:12px;
  border:1px solid var(--line);
}

.keypad{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.key{
  min-height:64px;
  border-radius:18px;
  background:#16271f;
  border:1px solid #20392d;
  font-size:21px;
  font-weight:700;
  transition:.12s;
}

.key:active{
  transform:scale(.95);
  background:#20382c;
}

.key.operator{
  color:var(--accent);
  background:#102319;
}

.key.action{
  color:#dce8e0;
}

.key.equal{
  background:var(--accent);
  color:#07110d;
}

.advanced{
  display:none;
  margin-top:10px;
}

.advanced.open{
  display:block;
}

.advanced-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.advanced .key{
  min-height:50px;
  font-size:16px;
}

.more{
  width:100%;
  margin:10px 0;
  padding:11px;
  border-radius:14px;
  background:transparent;
  color:var(--accent);
  border:1px solid #294437;
}

.form-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  margin-bottom:12px;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:12px;
}

.tab{
  padding:11px 4px;
  border-radius:12px;
  background:#0b1711;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
}

.tab.active{
  background:var(--accent);
  color:#07110d;
}

.field{
  margin-bottom:12px;
}

.field label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
}

.field input,
.field select{
  width:100%;
  padding:14px;
  border-radius:13px;
  background:#09150f;
  border:1px solid var(--line);
  color:var(--text);
  outline:none;
}

.field input:focus{
  border-color:var(--accent);
}

.primary{
  width:100%;
  padding:14px;
  border-radius:14px;
  background:var(--accent);
  color:#07110d;
  font-weight:900;
}

.result{
  margin-top:14px;
  padding:15px;
  border-radius:15px;
  background:#09150f;
  border:1px solid var(--line);
}

.result-row{
  display:flex;
  justify-content:space-between;
  padding:7px 0;
  border-bottom:1px solid #17271f;
}

.result-row:last-child{
  border-bottom:0;
}

.result-row span:first-child{
  color:var(--muted);
}

.history-empty{
  padding:30px;
  text-align:center;
  color:var(--muted);
}

.history-item{
  padding:14px 0;
  border-bottom:1px solid var(--line);
}

.history-item .top{
  display:flex;
  justify-content:space-between;
}

.history-item small{
  color:var(--muted);
}

.settings-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 0;
  border-bottom:1px solid var(--line);
}

.bottom{
  position:fixed;
  z-index:20;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  height:74px;
  background:rgba(7,17,13,.96);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:7px 8px;
}

.nav{
  background:transparent;
  color:var(--muted);
  font-size:11px;
  border-radius:13px;
}

.nav.active{
  color:var(--accent);
  background:#0e1e16;
}

.nav b{
  display:block;
  font-size:20px;
  margin-bottom:2px;
}

.toast{
  position:fixed;
  z-index:50;
  left:50%;
  bottom:90px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  background:#edf7f0;
  color:#07110d;
  padding:11px 16px;
  border-radius:13px;
  font-weight:700;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.light{
  --bg:#f3f6f4;
  --card:#fff;
  --text:#142019;
  --muted:#66756d;
  --line:#dbe4df;
}

.light .bottom{
  background:rgba(243,246,244,.96);
}

@media(max-width:370px){
  .key{
    min-height:58px;
  }

  .calc-display{
    font-size:36px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">
    CALPRO <span>EXPERT</span>
  </div>

  <button class="header-btn" id="themeBtn">
    ◐
  </button>
</header>

<main>

<!-- ================= HOME ================= -->

<section id="home" class="screen active">

  <div class="hero">
    <h1>Calculadora comercial</h1>
    <p>Ferramentas rápidas para sua rotina de vendas.</p>
  </div>

  <div class="grid">

    <button class="card tool" data-open="margin">
      <div class="icon">%</div>
      <strong>MARGEM</strong>
      <small>Lucro, margem e markup</small>
    </button>

    <button class="card tool" data-open="price">
      <div class="icon">R$</div>
      <strong>PREÇO</strong>
      <small>Calcule o preço de venda</small>
    </button>

    <button class="card tool" data-open="discount">
      <div class="icon">−%</div>
      <strong>DESCONTO</strong>
      <small>Preço final e desconto</small>
    </button>

    <button class="card tool" data-open="markup">
      <div class="icon">×</div>
      <strong>MARKUP</strong>
      <small>Markup, preço e margem</small>
    </button>

    <button class="card tool" data-nav="calculator">
      <div class="icon">⌗</div>
      <strong>CALCULADORA</strong>
      <small>Calculadora completa</small>
    </button>

  </div>

  <div class="ad">
    ESPAÇO PARA DIVULGAÇÃO
  </div>

</section>


<!-- ================= CALCULADORA ================= -->

<section id="calculator" class="screen">

  <div class="section-title">
    Calculadora
  </div>

  <div class="calc-card">

    <div class="display">

      <div id="calcOperation" class="operation"></div>

      <div id="calcDisplay" class="calc-display">
        0
      </div>

      <div style="font-size:10px;color:var(--muted);margin-top:4px">
        Formato brasileiro: 1.234,56
      </div>

    </div>


    <!-- MEMÓRIA -->

    <div class="memory">

      <button data-memory="MC">MC</button>
      <button data-memory="MR">MR</button>
      <button data-memory="M+">M+</button>
      <button data-memory="M−">M−</button>
      <button data-memory="MS">MS</button>

    </div>


    <!-- TECLADO -->

    <div class="keypad">

      <button class="key action" data-key="clear">
        AC
      </button>

      <button class="key action" data-key="backspace">
        ⌫
      </button>

      <button class="key operator" data-key="percent">
        %
      </button>

      <button class="key operator" data-key="divide">
        ÷
      </button>


      <button class="key" data-number="7">
        7
      </button>

      <button class="key" data-number="8">
        8
      </button>

      <button class="key" data-number="9">
        9
      </button>

      <button class="key operator" data-key="multiply">
        ×
      </button>


      <button class="key" data-number="4">
        4
      </button>

      <button class="key" data-number="5">
        5
      </button>

      <button class="key" data-number="6">
        6
      </button>

      <button class="key operator" data-key="subtract">
        −
      </button>


      <button class="key" data-number="1">
        1
      </button>

      <button class="key" data-number="2">
        2
      </button>

      <button class="key" data-number="3">
        3
      </button>

      <button class="key operator" data-key="add">
        +
      </button>


      <button class="key action" data-key="sign">
        +/−
      </button>

      <button class="key" data-number="0">
        0
      </button>

      <button class="key" data-key="decimal">
        ,
      </button>

      <button class="key equal" data-key="equals">
        =
      </button>

    </div>


    <button class="more" id="advancedToggle">
      Mais funções
    </button>


    <div class="advanced" id="advanced">

      <div class="advanced-grid">

        <button class="key" data-key="sqrt">
          √
        </button>

        <button class="key" data-key="square">
          x²
        </button>

        <button class="key" data-key="power">
          xʸ
        </button>

        <button class="key" data-key="clearEntry">
          CE
        </button>

        <button class="key" data-key="leftParen">
          (
        </button>

        <button class="key" data-key="rightParen">
          )
        </button>

        <button class="key" data-key="pi">
          π
        </button>

        <button class="key" data-key="repeat">
          ↻
        </button>

      </div>

    </div>

  </div>

</section>


<!-- ================= COMERCIAL ================= -->

<section id="commercial" class="screen">

  <div class="section-title">
    Ferramentas comerciais
  </div>

  <div class="form-card">

    <div class="tabs">

      <button class="tab active" data-tab="margin">
        MARGEM
      </button>

      <button class="tab" data-tab="price">
        PREÇO
      </button>

      <button class="tab" data-tab="discount">
        DESCONTO
      </button>

      <button class="tab" data-tab="markup">
        MARKUP
      </button>

    </div>


    <!-- MARGEM -->

    <div id="panel-margin" class="panel">

      <div class="field">

        <label>
          Custo (R$)
        </label>

        <input
          id="marginCost"
          type="text"
          inputmode="decimal"
          placeholder="0,00"
        >

      </div>


      <div class="field">

        <label>
          Preço de venda (R$)
        </label>

        <input
          id="marginSale"
          type="text"
          inputmode="decimal"
          placeholder="0,00"
        >

      </div>


      <button
        class="primary"
        data-calc-commercial="margin"
      >
        CALCULAR
      </button>


      <div
        id="result-margin"
        class="result"
        hidden
      ></div>

    </div>


    <!-- PREÇO -->

    <div
      id="panel-price"
      class="panel"
      hidden
    >

      <div class="field">

        <label>
          Custo (R$)
        </label>

        <input
          id="priceCost"
          type="text"
          inputmode="decimal"
          placeholder="0,00"
        >

      </div>


      <div class="field">

        <label>
          Margem desejada (%)
        </label>

        <input
          id="priceMargin"
          type="text"
          inputmode="decimal"
          placeholder="Ex.: 30,00"
        >

      </div>


      <div class="field">

        <label>
          Ou markup desejado (%)
        </label>

        <input
          id="priceMarkup"
          type="text"
          inputmode="decimal"
          placeholder="Ex.: 50,00"
        >

      </div>


      <button
        class="primary"
        data-calc-commercial="price"
      >
        CALCULAR
      </button>


      <div
        id="result-price"
        class="result"
        hidden
      ></div>

    </div>


    <!-- DESCONTO -->

    <div
      id="panel-discount"
      class="panel"
      hidden
    >

      <div class="field">

        <label>
          Preço original (R$)
        </label>

        <input
          id="discountOriginal"
          type="text"
          inputmode="decimal"
          placeholder="0,00"
        >

      </div>


      <div class="field">

        <label>
          Desconto (%)
        </label>

        <input
          id="discountPercent"
          type="text"
          inputmode="decimal"
          placeholder="Ex.: 10,00"
        >

      </div>


      <button
        class="primary"
        data-calc-commercial="discount"
      >
        CALCULAR
      </button>


      <div
        id="result-discount"
        class="result"
        hidden
      ></div>

    </div>


    <!-- MARKUP -->

    <div
      id="panel-markup"
      class="panel"
      hidden
    >

      <div class="field">

        <label>
          Custo (R$)
        </label>

        <input
          id="markupCost"
          type="text"
          inputmode="decimal"
          placeholder="0,00"
        >

      </div>


      <div class="field">

        <label>
          Markup (%)
        </label>

        <input
          id="markupPercent"
          type="text"
          inputmode="decimal"
          placeholder="Ex.: 50,00"
        >

      </div>


      <button
        class="primary"
        data-calc-commercial="markup"
      >
        CALCULAR
      </button>


      <div
        id="result-markup"
        class="result"
        hidden
      ></div>

    </div>

  </div>

</section>


<!-- ================= HISTÓRICO ================= -->

<section id="history" class="screen">

  <div class="section-title">
    Histórico
  </div>

  <div class="form-card">

    <button
      class="primary"
      id="clearHistory"
    >
      LIMPAR HISTÓRICO
    </button>

    <div id="historyList"></div>

  </div>

</section>


<!-- ================= CONFIGURAÇÕES ================= -->

<section id="settings" class="screen">

  <div class="section-title">
    Configurações
  </div>

  <div class="form-card">

    <div class="settings-row">

      <span>
        Tema
      </span>

      <select id="themeSelect">

        <option value="dark">
          Escuro
        </option>

        <option value="light">
          Claro
        </option>

      </select>

    </div>


    <div class="settings-row">

      <span>
        Vibração
      </span>

      <input
        id="vibrationToggle"
        type="checkbox"
        checked
      >

    </div>

  </div>

</section>

</main>


<!-- ================= MENU INFERIOR ================= -->

<nav class="bottom">

  <button
    class="nav active"
    data-nav="home"
  >
    <b>⌂</b>
    Início
  </button>

  <button
    class="nav"
    data-nav="calculator"
  >
    <b>⌗</b>
    Calculadora
  </button>

  <button
    class="nav"
    data-nav="commercial"
  >
    <b>%</b>
    Comercial
  </button>

  <button
    class="nav"
    data-nav="history"
  >
    <b>☷</b>
    Histórico
  </button>

</nav>

</div>

<div
  id="toast"
  class="toast"
></div>


<script>

"use strict";

document.addEventListener("DOMContentLoaded", () => {

  const $ = selector =>
    document.querySelector(selector);

  const $$ = selector =>
    Array.from(document.querySelectorAll(selector));


  /* =====================================================
     UTILITÁRIOS
  ===================================================== */

  const money = n => {

    if (!Number.isFinite(n))
      return "—";

    return n.toLocaleString(
      "pt-BR",
      {
        style:"currency",
        currency:"BRL"
      }
    );

  };


  /*
    Converte valores brasileiros:

    1.234,56
    1234,56
    1234.56
  */

  const num = id => {

    const el =
      document.getElementById(id);

    if (!el)
      return 0;

    const text =
      String(el.value).trim();

    if (!text)
      return 0;

    let normalized = text;

    if (text.includes(",")) {

      normalized =
        text
        .replace(/\./g,"")
        .replace(",",".");
    }

    const value =
      Number(normalized);

    return Number.isFinite(value)
      ? value
      : 0;
  };


  /*
    Formatação brasileira.

    1234.56

    vira:

    1.234,56
  */

  const formatBR = (
    value,
    decimals = 2
  ) => {

    if (!Number.isFinite(value))
      return "";

    return value.toLocaleString(
      "pt-BR",
      {
        minimumFractionDigits:decimals,
        maximumFractionDigits:decimals
      }
    );
  };


  /*
    Formatação utilizada internamente
    pela calculadora.
  */

  const fmt = n => {

    if (!Number.isFinite(n))
      return "Erro";

    const rounded =
      Number(n.toFixed(10));

    if (
      Math.abs(rounded) >= 1e15 ||
      (
        Math.abs(rounded) > 0 &&
        Math.abs(rounded) < 1e-9
      )
    ){

      return rounded
        .toExponential(8)
        .replace(".",",");
    }

    return rounded.toLocaleString(
      "pt-BR",
      {
        useGrouping:true,
        maximumFractionDigits:10
      }
    );
  };


  /*
    Converte o visor brasileiro
    para número.
  */

  const rawNumber = value => {

    const clean =
      String(value)
      .replace(/\./g,"")
      .replace(",", ".");

    return Number(clean);
  };


  function toast(message){

    const element =
      $("#toast");

    element.textContent =
      message;

    element.classList.add("show");

    clearTimeout(
      window.__toastTimer
    );

    window.__toastTimer =
      setTimeout(
        () => {
          element.classList.remove("show");
        },
        1600
      );
  }


  function vibrate(){

    if (
      $("#vibrationToggle")?.checked &&
      navigator.vibrate
    ){

      navigator.vibrate(8);

    }

  }


  /* =====================================================
     NAVEGAÇÃO
  ===================================================== */

  function showScreen(id){

    $$(".screen").forEach(
      screen => {

        screen.classList.toggle(
          "active",
          screen.id === id
        );

      }
    );


    $$(".nav").forEach(
      nav => {

        nav.classList.toggle(
          "active",
          nav.dataset.nav === id
        );

      }
    );


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }


  $$("[data-nav]").forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          vibrate();

          showScreen(
            button.dataset.nav
          );

        }
      );

    }
  );


  $$("[data-open]").forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          showScreen("commercial");

          setCommercialTab(
            button.dataset.open
          );

        }
      );

    }
  );


  function setCommercialTab(name){

    $$(".tab").forEach(
      tab => {

        tab.classList.toggle(
          "active",
          tab.dataset.tab === name
        );

      }
    );


    $$(".panel").forEach(
      panel => {

        panel.hidden =
          panel.id !==
          "panel-" + name;

      }
    );

  }


  $$("[data-tab]").forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          setCommercialTab(
            button.dataset.tab
          );

        }
      );

    }
  );


  /* =====================================================
     CALCULADORA
  ===================================================== */

  const calcDisplay =
    $("#calcDisplay");

  const calcOperation =
    $("#calcOperation");


  const calc = {

    current:"0",

    previous:null,

    operator:null,

    waiting:false,

    expression:"",

    memory:Number(
      localStorage.getItem(
        "calpro_memory"
      ) || 0
    ),

    lastOperator:null,

    lastOperand:null,

    error:false

  };


  const symbols = {

    add:"+",

    subtract:"−",

    multiply:"×",

    divide:"÷",

    power:"^"

  };


  function updateDisplay(){

    calcDisplay.textContent =
      calc.current;

    calcOperation.textContent =
      calc.expression || "";

    calcDisplay.scrollLeft =
      calcDisplay.scrollWidth;

  }


  function resetCalc(){

    calc.current =
      "0";

    calc.previous =
      null;

    calc.operator =
      null;

    calc.waiting =
      false;

    calc.expression =
      "";

    calc.lastOperator =
      null;

    calc.lastOperand =
      null;

    calc.error =
      false;

    updateDisplay();

  }


  function inputNumber(value){

    vibrate();

    if (calc.error)
      resetCalc();


    if (calc.waiting){

      calc.current =
        value;

      calc.waiting =
        false;

    }else{

      calc.current =
        calc.current === "0"
          ? value
          : calc.current + value;

    }


    updateDisplay();

  }


  function inputDecimal(){

    vibrate();

    if (calc.error)
      resetCalc();


    if (calc.waiting){

      calc.current =
        "0,";

      calc.waiting =
        false;

    }else if(
      !calc.current.includes(",")
    ){

      calc.current += ",";

    }


    updateDisplay();

  }


  function backspace(){

    vibrate();

    if (calc.error){

      resetCalc();

      return;
    }


    if (calc.waiting)
      return;


    if (
      calc.current.length <= 1 ||
      (
        calc.current.length === 2 &&
        calc.current.startsWith("-")
      )
    ){

      calc.current =
        "0";

    }else{

      calc.current =
        calc.current.slice(0,-1);

    }


    updateDisplay();

  }


  function sign(){

    vibrate();

    if (calc.error)
      return;


    if (calc.current === "0")
      return;


    calc.current =
      calc.current.startsWith("-")
        ? calc.current.slice(1)
        : "-" + calc.current;


    updateDisplay();

  }


  function percent(){

    vibrate();

    if (calc.error)
      return;


    const value =
      rawNumber(calc.current);


    if (!Number.isFinite(value))
      return;


    if (
      calc.previous !== null &&
      (
        calc.operator === "add" ||
        calc.operator === "subtract"
      )
    ){

      calc.current =
        fmt(
          calc.previous *
          value /
          100
        );

    }else{

      calc.current =
        fmt(value / 100);

    }


    updateDisplay();

  }


  function applyOperation(
    a,
    b,
    op
  ){

    switch(op){

      case "add":
        return a + b;

      case "subtract":
        return a - b;

      case "multiply":
        return a * b;

      case "divide":
        return b === 0
          ? NaN
          : a / b;

      case "power":
        return Math.pow(a,b);

      default:
        return b;

    }

  }


  function chooseOperator(op){

    vibrate();

    if (calc.error)
      return;


    const value =
      rawNumber(calc.current);


    if (!Number.isFinite(value))
      return;


    if (
      calc.operator &&
      calc.previous !== null &&
      !calc.waiting
    ){

      const result =
        applyOperation(
          calc.previous,
          value,
          calc.operator
        );


      if (!Number.isFinite(result)){

        showError();

        return;

      }


      calc.previous =
        result;

      calc.current =
        fmt(result);

    }else{

      calc.previous =
        value;

    }


    calc.operator =
      op;

    calc.waiting =
      true;

    calc.lastOperator =
      null;

    calc.lastOperand =
      null;

    calc.expression =
      `${fmt(calc.previous)} ${symbols[op]}`;

    updateDisplay();

  }


  function equals(){

    vibrate();

    if (calc.error)
      return;


    let result;


    if (
      calc.operator !== null &&
      calc.previous !== null
    ){

      const right =
        calc.waiting
          ? calc.previous
          : rawNumber(calc.current);


      result =
        applyOperation(
          calc.previous,
          right,
          calc.operator
        );


      if (!Number.isFinite(result)){

        showError();

        return;

      }


      calc.lastOperator =
        calc.operator;

      calc.lastOperand =
        right;


      calc.current =
        fmt(result);


      calc.expression =
        `${fmt(calc.previous)} ${
          symbols[calc.operator]
        } ${fmt(right)} =`;


      calc.previous =
        null;

      calc.operator =
        null;

      calc.waiting =
        true;

    }else if(
      calc.lastOperator !== null &&
      calc.lastOperand !== null
    ){

      const left =
        rawNumber(calc.current);


      result =
        applyOperation(
          left,
          calc.lastOperand,
          calc.lastOperator
        );


      if (!Number.isFinite(result)){

        showError();

        return;

      }


      calc.expression =
        `${fmt(left)} ${
          symbols[calc.lastOperator]
        } ${fmt(calc.lastOperand)} =`;


      calc.current =
        fmt(result);

      calc.waiting =
        true;

    }else{

      return;

    }


    addHistory(
      "Calculadora",
      calc.expression,
      calc.current
    );


    updateDisplay();

  }


  function unary(type){

    vibrate();

    if (calc.error)
      return;


    const value =
      rawNumber(calc.current);


    if (!Number.isFinite(value))
      return;


    let result;

    let label = "";


    if (type === "sqrt"){

      if (value < 0){

        showError();

        return;

      }

      result =
        Math.sqrt(value);

      label =
        `√${fmt(value)}`;

    }


    if (type === "square"){

      result =
        value * value;

      label =
        `${fmt(value)}²`;

    }


    calc.current =
      fmt(result);

    calc.expression =
      `${label} =`;

    calc.waiting =
      true;


    addHistory(
      "Calculadora",
      calc.expression,
      calc.current
    );


    updateDisplay();

  }


  function clearEntry(){

    vibrate();

    calc.current =
      "0";

    calc.waiting =
      false;

    updateDisplay();

  }


  function showError(){

    calc.current =
      "Erro";

    calc.expression =
      "Operação inválida";

    calc.error =
      true;

    updateDisplay();

  }


  function insertParenthesis(side){

    if (calc.error)
      resetCalc();


    if (
      !calc.expression ||
      calc.waiting
    ){

      if (side === "left"){

        calc.expression =
          "(";

        calc.current =
          "0";

      }


      calc.waiting =
        false;

      updateDisplay();

      return;

    }


    calc.expression +=
      side === "left"
        ? " ("
        : " )";


    updateDisplay();

  }


  function insertPi(){

    if (calc.error)
      resetCalc();


    calc.current =
      fmt(Math.PI);

    calc.waiting =
      true;

    calc.expression =
      "π";

    updateDisplay();

  }


  function repeatLast(){

    equals();

  }


  /*
    UM ÚNICO EVENT LISTENER
    PARA TODOS OS BOTÕES.
  */

  $$(".key").forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          const number =
            button.dataset.number;

          const key =
            button.dataset.key;


          if (
            number !== undefined
          ){

            inputNumber(number);

            return;

          }


          switch(key){

            case "clear":
              resetCalc();
              break;

            case "backspace":
              backspace();
              break;

            case "decimal":
              inputDecimal();
              break;

            case "sign":
              sign();
              break;

            case "percent":
              percent();
              break;

            case "divide":
            case "multiply":
            case "subtract":
            case "add":
            case "power":

              chooseOperator(key);

              break;

            case "equals":
              equals();
              break;

            case "sqrt":
              unary("sqrt");
              break;

            case "square":
              unary("square");
              break;

            case "clearEntry":
              clearEntry();
              break;

            case "leftParen":
              insertParenthesis("left");
              break;

            case "rightParen":
              insertParenthesis("right");
              break;

            case "pi":
              insertPi();
              break;

            case "repeat":
              repeatLast();
              break;

          }

        }
      );

    }
  );


  /* =====================================================
     TECLADO FÍSICO
  ===================================================== */

  document.addEventListener(
    "keydown",
    event => {

      const tag =
        document.activeElement?.tagName;


      if (
        tag === "INPUT" ||
        tag === "TEXTAREA" ||
        tag === "SELECT"
      ){

        return;

      }


      const k =
        event.key;


      if (/^[0-9]$/.test(k)){

        event.preventDefault();

        inputNumber(k);

      }

      else if(
        k === "." ||
        k === ","
      ){

        event.preventDefault();

        inputDecimal();

      }

      else if(k === "+"){

        event.preventDefault();

        chooseOperator("add");

      }

      else if(k === "-"){

        event.preventDefault();

        chooseOperator("subtract");

      }

      else if(k === "*"){

        event.preventDefault();

        chooseOperator("multiply");

      }

      else if(k === "/"){

        event.preventDefault();

        chooseOperator("divide");

      }

      else if(k === "^"){

        event.preventDefault();

        chooseOperator("power");

      }

      else if(k === "%"){

        event.preventDefault();

        percent();

      }

      else if(
        k === "Enter" ||
        k === "="
      ){

        event.preventDefault();

        equals();

      }

      else if(k === "Backspace"){

        event.preventDefault();

        backspace();

      }

      else if(k === "Escape"){

        event.preventDefault();

        resetCalc();

      }

    }
  );


  /* =====================================================
     FUNÇÕES AVANÇADAS
  ===================================================== */

  $("#advancedToggle")
    .addEventListener(
      "click",
      () => {

        $("#advanced")
          .classList.toggle("open");


        $("#advancedToggle")
          .textContent =
          $("#advanced")
            .classList.contains("open")
            ? "Ocultar funções"
            : "Mais funções";

      }
    );


  /* =====================================================
     MEMÓRIA
  ===================================================== */

  $$("[data-memory]").forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          vibrate();

          const action =
            button.dataset.memory;

          const value =
            rawNumber(calc.current);

          let message = "";


          if(action === "MC"){

            calc.memory = 0;

            message =
              "Memória limpa";

          }


          else if(action === "MR"){

            calc.current =
              fmt(calc.memory);

            calc.waiting =
              true;

            message =
              "Memória recuperada";

          }


          else if(action === "M+"){

            if(
              Number.isFinite(value)
            ){

              calc.memory +=
                value;

            }

            message =
              "Valor somado à memória";

          }


          else if(action === "M−"){

            if(
              Number.isFinite(value)
            ){

              calc.memory -=
                value;

            }

            message =
              "Valor subtraído da memória";

          }


          else if(action === "MS"){

            if(
              Number.isFinite(value)
            ){

              calc.memory =
                value;

            }

            message =
              "Valor salvo na memória";

          }


          localStorage.setItem(
            "calpro_memory",
            String(calc.memory)
          );


          updateDisplay();

          toast(message);

        }
      );

    }
  );


  /* =====================================================
     HISTÓRICO
  ===================================================== */

  function getHistory(){

    try{

      return JSON.parse(
        localStorage.getItem(
          "calpro_history"
        ) || "[]"
      );

    }catch{

      return [];

    }

  }


  function addHistory(
    type,
    expression,
    result
  ){

    const history =
      getHistory();


    history.unshift({

      type,

      expression,

      result:String(result),

      date:
        new Date()
        .toLocaleString("pt-BR")

    });


    localStorage.setItem(
      "calpro_history",
      JSON.stringify(
        history.slice(0,100)
      )
    );


    renderHistory();

  }


  function escapeHtml(value){

    return String(value)
      .replace(
        /[&<>"']/g,
        character => ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[character])
      );

  }


  function renderHistory(){

    const list =
      $("#historyList");

    const history =
      getHistory();


    if(!history.length){

      list.innerHTML =
        '<div class="history-empty">Nenhum cálculo realizado ainda.</div>';

      return;

    }


    list.innerHTML =
      history.map(
        item => `

          <div class="history-item">

            <div class="top">

              <strong>
                ${escapeHtml(item.type)}
              </strong>

              <strong>
                ${escapeHtml(item.result)}
              </strong>

            </div>

            <div>
              ${escapeHtml(item.expression)}
            </div>

            <small>
              ${escapeHtml(item.date)}
            </small>

          </div>

        `
      ).join("");

  }


  $("#clearHistory")
    .addEventListener(
      "click",
      () => {

        localStorage.removeItem(
          "calpro_history"
        );

        renderHistory();

        toast(
          "Histórico apagado"
        );

      }
    );


  /* =====================================================
     CALCULADORAS COMERCIAIS
  ===================================================== */

  function resultBox(
    id,
    rows
  ){

    const box =
      $("#" + id);


    box.hidden =
      false;


    box.innerHTML =
      rows.map(
        ([label,value]) => `

          <div class="result-row">

            <span>
              ${escapeHtml(label)}
            </span>

            <strong>
              ${escapeHtml(value)}
            </strong>

          </div>

        `
      ).join("");

  }


  $$("[data-calc-commercial]")
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            vibrate();

            const type =
              button.dataset
                .calcCommercial;


            /* =====================
               MARGEM
            ===================== */

            if(type === "margin"){

              const cost =
                num("marginCost");

              const sale =
                num("marginSale");


              if(
                cost <= 0 ||
                sale <= 0
              ){

                toast(
                  "Informe custo e preço de venda"
                );

                return;

              }


              const profit =
                sale - cost;


              const margin =
                profit /
                sale *
                100;


              const markup =
                profit /
                cost *
                100;


              resultBox(
                "result-margin",
                [

                  [
                    "Lucro",
                    money(profit)
                  ],

                  [
                    "Margem",
                    formatBR(
                      margin,
                      2
                    ) + "%"
                  ],

                  [
                    "Markup",
                    formatBR(
                      markup,
                      2
                    ) + "%"
                  ]

                ]
              );


              addHistory(
                "Margem",
                `${money(cost)} → ${money(sale)}`,
                formatBR(
                  margin,
                  2
                ) + "%"
              );

            }


            /* =====================
               PREÇO
            ===================== */

            if(type === "price"){

              const cost =
                num("priceCost");

              const margin =
                num("priceMargin");

              const markup =
                num("priceMarkup");


              if(cost <= 0){

                toast(
                  "Informe o custo"
                );

                return;

              }


              let sale;

              let method;


              if(margin > 0){

                if(margin >= 100){

                  toast(
                    "A margem deve ser menor que 100%"
                  );

                  return;

                }


                sale =
                  cost /
                  (
                    1 -
                    margin / 100
                  );


                method =
                  `Margem ${formatBR(
                    margin,
                    2
                  )}%`;

              }

              else if(markup > 0){

                sale =
                  cost *
                  (
                    1 +
                    markup / 100
                  );


                method =
                  `Markup ${formatBR(
                    markup,
                    2
                  )}%`;

              }

              else{

                toast(
                  "Informe margem ou markup"
                );

                return;

              }


              const profit =
                sale - cost;


              const realMargin =
                profit /
                sale *
                100;


              const realMarkup =
                profit /
                cost *
                100;


              resultBox(
                "result-price",
                [

                  [
                    "Método",
                    method
                  ],

                  [
                    "Preço de venda",
                    money(sale)
                  ],

                  [
                    "Lucro",
                    money(profit)
                  ],

                  [
                    "Margem real",
                    formatBR(
                      realMargin,
                      2
                    ) + "%"
                  ],

                  [
                    "Markup real",
                    formatBR(
                      realMarkup,
                      2
                    ) + "%"
                  ]

                ]
              );


              addHistory(
                "Preço",
                `${money(cost)} → ${money(sale)}`,
                money(sale)
              );

            }


            /* =====================
               DESCONTO
            ===================== */

            if(type === "discount"){

              const original =
                num("discountOriginal");

              const percent =
                num("discountPercent");


              if(
                original <= 0 ||
                percent < 0
              ){

                toast(
                  "Informe os valores corretamente"
                );

                return;

              }


              const discount =
                original *
                percent /
                100;


              const final =
                original -
                discount;


              resultBox(
                "result-discount",
                [

                  [
                    "Desconto",
                    money(discount)
                  ],

                  [
                    "Preço final",
                    money(final)
                  ],

                  [
                    "Percentual",
                    formatBR(
                      percent,
                      2
                    ) + "%"
                  ]

                ]
              );


              addHistory(
                "Desconto",
                `${money(original)} − ${formatBR(percent,2)}%`,
                money(final)
              );

            }


            /* =====================
               MARKUP
            ===================== */

            if(type === "markup"){

              const cost =
                num("markupCost");

              const percent =
                num("markupPercent");


              if(
                cost <= 0 ||
                percent < 0
              ){

                toast(
                  "Informe os valores corretamente"
                );

                return;

              }


              const profit =
                cost *
                percent /
                100;


              const sale =
                cost +
                profit;


              const margin =
                profit /
                sale *
                100;


              resultBox(
                "result-markup",
                [

                  [
                    "Preço de venda",
                    money(sale)
                  ],

                  [
                    "Lucro",
                    money(profit)
                  ],

                  [
                    "Margem",
                    formatBR(
                      margin,
                      2
                    ) + "%"
                  ],

                  [
                    "Markup",
                    formatBR(
                      percent,
                      2
                    ) + "%"
                  ]

                ]
              );


              addHistory(
                "Markup",
                `${money(cost)} + ${formatBR(percent,2)}%`,
                money(sale)
              );

            }

          }
        );

      }
    );


  /* =====================================================
     MÁSCARA BRASILEIRA DOS CAMPOS
  ===================================================== */

  function formatInputBR(input){

    let value =
      input.value
      .replace(
        /[^0-9,.-]/g,
        ""
      );


    const negative =
      value.startsWith("-");


    value =
      value.replace(
        /-/g,
        ""
      );


    if(negative)
      value =
        "-" + value;


    const parts =
      value.split(",");


    let integer =
      parts[0];


    let decimal =
      parts.length > 1
        ? parts
            .slice(1)
            .join("")
        : "";


    const sign =
      integer.startsWith("-")
        ? "-"
        : "";


    integer =
      integer
      .replace(
        "-",
        ""
      )
      .replace(
        /^0+(?=\d)/,
        ""
      );


    integer =
      integer.replace(
        /\B(?=(\d{3})+(?!\d))/g,
        "."
      );


    input.value =
      sign +
      integer +
      (
        parts.length > 1
          ? "," +
            decimal.slice(0,10)
          : ""
      );

  }


  [
    "marginCost",
    "marginSale",
    "priceCost",
    "priceMargin",
    "priceMarkup",
    "discountOriginal",
    "discountPercent",
    "markupCost",
    "markupPercent"

  ].forEach(
    id => {

      const input =
        document.getElementById(id);


      if(!input)
        return;


      input.addEventListener(
        "input",
        () => {

          formatInputBR(
            input
          );

        }
      );


      input.addEventListener(
        "blur",
        () => {

          const value =
            num(id);


          if(
            input.value.trim() !== "" &&
            Number.isFinite(value)
          ){

            input.value =
              formatBR(
                value,
                2
              );

          }

        }
      );

    }
  );


  /* =====================================================
     TEMA
  ===================================================== */

  const savedTheme =
    localStorage.getItem(
      "calpro_theme"
    ) || "dark";


  document.body.classList.toggle(
    "light",
    savedTheme === "light"
  );


  $("#themeSelect").value =
    savedTheme;


  function setTheme(theme){

    document.body.classList.toggle(
      "light",
      theme === "light"
    );


    localStorage.setItem(
      "calpro_theme",
      theme
    );


    $("#themeSelect").value =
      theme;

  }


  $("#themeSelect")
    .addEventListener(
      "change",
      event => {

        setTheme(
          event.target.value
        );

      }
    );


  $("#themeBtn")
    .addEventListener(
      "click",
      () => {

        setTheme(
          document.body.classList
            .contains("light")
            ? "dark"
            : "light"
        );

      }
    );


  /* =====================================================
     INICIALIZAÇÃO
  ===================================================== */

  renderHistory();

  updateDisplay();

});

</script>
